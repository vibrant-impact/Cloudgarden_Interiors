<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italianno&family=Josefin+Slab:ital,wght@0,100..700;1,100..700;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <title>CloudGarden Interiors Contact</title>
</head>
<body>
  <header>
    <p id="headerSlogan">Live where nature breathes.</p>
  </header>

  <div id="fixedNavBar">
    <div id="logo" class="navElement">
      <a href="index.html">
        <img src="assets/images/cloudgarden-logo.png" alt="Cloudgarden Logo">
      </a>
    </div>
    <nav id="desktopNav">
      <a class="navLink" href="index.html">Home</a>
      <a class="navLink" href="about.html">About Us</a>
      <a class="navLink" href="portfolio.html">Portfolio</a>
      <a class="navLink active" href="contact.html">Contact Us</a>
    </nav>
    <button id="menuToggle" aria-label="Toggle Navigation">
      <svg viewBox="0 0 100 80" width="25" height="25" fill="#333">
        <rect width="100" height="15"></rect>
        <rect y="30" width="100" height="15"></rect>
        <rect y="60" width="100" height="15"></rect>
      </svg>
    </button>
    <div id="socialIcons" class="navElement">
      <span>
        <a href="https://www.instagram.com/" target="_blank"> <img src="assets/images/instagram.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/" target="_blank"> <img src="assets/images/facebook.png" alt="Facebook"></a>
        <a href="http://pinterest.com/" target="_blank"> <img src="assets/images/pinterest.png" alt="Pinterest"></a>
        <a href="https://youtube.com/" target="_blank"> <img src="assets/images/youtube.png" alt="Youtube"></a>
      </span>
    </div>
  </div>

  <div id="mobileMenu">
  </div>

  <main id="contentArea">
    <section>
      <div class="contentBox">
        <div>
          <h1>Get in Touch</h1>
        </div>
        <p class="contactIntro">
          We're excited to hear about your project! Please fill out the form below, and our team will get back to you within 48 hours.
        </p>

        <form class="contactForm">
          <div class="formGroup floatGroup">
            <div class="floatInputLeft">
              <label for="name">Your Full Name:</label>
              <input type="text" id="name" name="name" required placeholder="Jane Doe">
            </div>

            <div class="floatInputRight">
              <label for="email">Email Address:</label>
              <input type="email" id="email" name="email" required placeholder="jane.doe@example.com">
            </div>
            
            <div class="clearfix"></div> 
          </div>
          
          <div class="formGroup">
            <label for="phone">Phone Number (Optional):</label>
            <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890">
          </div>
          
          <div class="formGroup">
            <label for="subject">Project Type:</label>
            <select id="subject" name="subject" required>
              <option value="" disabled selected>Select a service (e.g., Residential, Commercial)</option>
              <option value="Residential">Residential Design (Home/Apartment)</option>
              <option value="Commercial">Commercial/Office Design</option>
              <option value="Consultation">Biophilic Consultation Only</option>
              <option value="Other">Other Inquiry</option>
            </select>
          </div>
          
          <div class="formGroup">
            <label for="message">Tell us about your space and vision:</label>
            <textarea id="message" name="message" rows="6" required placeholder="I'm looking for a full living room redesign focusing on natural wood and indoor plants..."></textarea>
          </div>
          
          <button type="submit" class="submitButton">Send Inquiry</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CloudGarden Interiors. | Live where nature breathes.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
